name = "pawanraja-portfolio"
main = "worker/index.js"
compatibility_date = "2024-09-23"

# Automatically build frontend before deployment
[build]
command = "npm run build"

# Serve static frontend from dist directory
[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
ENVIRONMENT = "production"
DEFAULT_CACHE_TTL = "15"

# Cloudflare KV Namespace Binding (Optional: uncomment once KV namespace is created)
# [[kv_namespaces]]
# binding = "PORTFOLIO_KV"
# id = "<YOUR_PRODUCTION_KV_ID>"


name = "pawanraja-portfolio"
main = "worker/index.js"
compatibility_date = "2024-09-23"

# Automatically build frontend before deployment
[build]
command = "npm run build"

# Serve static frontend from dist directory
[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
ENVIRONMENT = "production"
DEFAULT_CACHE_TTL = "15"

# Cloudflare KV Namespace Binding (Permanent)
[[kv_namespaces]]
binding = "PORTFOLIO_KV"
id = "710d7cb3c63f48df8debf45a073677a0"

